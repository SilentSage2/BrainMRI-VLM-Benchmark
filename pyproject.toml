[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "mri-vlm-grounding"
version = "0.1.0"
description = "Grounded 3D vision-language reasoning over multi-sequence brain MRI"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Ziyang Xu" }]
dependencies = [
  "numpy==2.5.3",
  "torch>=2.4,<3",
]

[project.optional-dependencies]
data = [
  "nibabel==5.4.2",
]
figures = [
  "matplotlib==3.10.6",
  "nibabel==5.4.2",
]
dev = [
  "mypy==1.15.0",
  "pytest==8.3.5",
  "ruff==0.9.10",
]

[project.scripts]
mri-vlm-v0-audit = "mri_vlm.cli:main"
mri-vlm-msd-audit = "mri_vlm.data_cli:main"
mri-vlm-cohort-figure = "mri_vlm.figure_cli:main"
mri-vlm-method-figure = "mri_vlm.method_figure_cli:main"
mri-vlm-abstract-lint = "mri_vlm.abstract_lint:main"
mri-vlm-real-controls = "mri_vlm.real_controls_cli:main"
mri-vlm-real-pilot = "mri_vlm.pilot_cli:main"
mri-vlm-overfit-check = "mri_vlm.overfit_cli:main"
mri-vlm-qa-stability = "mri_vlm.qa_stability_cli:main"
mri-vlm-stability-figure = "mri_vlm.stability_figure_cli:main"
mri-vlm-baseline = "mri_vlm.baseline_cli:main"
mri-vlm-matched = "mri_vlm.matched_cli:main"
mri-vlm-multiseed = "mri_vlm.multiseed_cli:main"
mri-vlm-qa-v1-control = "mri_vlm.qa_v1_control_cli:main"
mri-vlm-slice-baseline = "mri_vlm.slice_cli:main"
mri-vlm-matched-figure = "mri_vlm.matched_figure_cli:main"
mri-vlm-modular-multiseed = "mri_vlm.modular_multiseed_cli:main"
mri-vlm-modular-figure = "mri_vlm.modular_figure_cli:main"
mri-vlm-preview-figure = "mri_vlm.preview_figure_cli:main"
mri-vlm-submission-preflight = "mri_vlm.submission_preflight_cli:main"
mri-vlm-heldout-once = "mri_vlm.heldout_once_cli:main"
mri-vlm-heldout-figure = "mri_vlm.heldout_figure_cli:main"
mri-vlm-nnunet-export = "mri_vlm.nnunet_export_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mri_vlm"]

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mri_vlm"]
mypy_path = "src"
