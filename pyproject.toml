[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "mri-vlm-grounding"
version = "0.1.0"
description = "Grounded 3D vision-language reasoning over multi-sequence brain MRI"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Ziyang Xu" }]
dependencies = [
  "torch>=2.4,<3",
]

[project.optional-dependencies]
data = [
  "nibabel==5.4.2",
  "numpy==2.5.3",
]
figures = [
  "matplotlib==3.10.6",
  "nibabel==5.4.2",
  "numpy==2.5.3",
]
dev = [
  "mypy==1.15.0",
  "pytest==8.3.5",
  "ruff==0.9.10",
]

[project.scripts]
mri-vlm-v0-audit = "mri_vlm.cli:main"
mri-vlm-msd-audit = "mri_vlm.data_cli:main"
mri-vlm-cohort-figure = "mri_vlm.figure_cli:main"
mri-vlm-method-figure = "mri_vlm.method_figure_cli:main"
mri-vlm-abstract-lint = "mri_vlm.abstract_lint:main"
mri-vlm-real-controls = "mri_vlm.real_controls_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mri_vlm"]

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mri_vlm"]
mypy_path = "src"
