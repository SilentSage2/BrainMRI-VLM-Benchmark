[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "scivlm-lab"
version = "0.1.0"
description = "Leakage-aware scientific figure-text retrieval and grounded QA research"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Ziyang Xu" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy==1.15.0",
  "pytest==8.3.5",
  "ruff==0.9.10",
]

[project.scripts]
scivlm-v0-audit = "scivlm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/scivlm"]

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["scivlm"]
mypy_path = "src"
